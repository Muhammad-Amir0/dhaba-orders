services:
  postgres:
    image: postgres:16.6-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  menu-api:
    image: python:3.12.8-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && exec uvicorn app:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./menu-api:/app
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      HOSTNAME: menu-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  orders-api:
    image: golang:1.22.12-bookworm
    working_dir: /app
    command: sh -c "go mod download && exec go run ."
    volumes:
      - ./orders-api:/app
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      HOSTNAME: orders-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"

  kitchen-worker:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./kitchen-worker:/app
      - maven_cache:/root/.m2
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      HOSTNAME: kitchen-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stats-api:
    image: composer:2.8.12
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - composer install --no-interaction --no-progress && exec php artisan serve --host 0.0.0.0 --port 8080
    volumes:
      - ./stats-api:/app
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      HOSTNAME: stats-api
      APP_ENV: local
      APP_DEBUG: "false"
      CACHE_STORE: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8083:8080"

  web:
    image: node:22.13.1-alpine3.21
    working_dir: /app
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8081:80"
    depends_on:
      - menu-api
      - orders-api
      - stats-api

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  web_node_modules:
